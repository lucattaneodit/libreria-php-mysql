<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuevo libro - Librería</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Barra de navegación -->
    <nav class="barra">
        <span class="logo">Librería Luce</span>
        <a href="index.html" class="activo">Registrar libro</a>
        <a href="buscarLlibre.php">Ver libros</a>
        <form class="buscador" action="buscarLlibre.php" method="get">
            <input type="search" name="q" placeholder="Buscar por título...">
            <input type="submit" value="Buscar">
        </form>
    </nav>

    <h1>Registrar nuevo libro</h1>

    <!-- method="post": los datos viajan ocultos y en PHP se recogen con $_POST -->
    <form class="tarjeta" action="inserirLlibre.php" method="post">
        <label for="titol">Título del libro</label>
        <input type="text" id="titol" name="ftitol" maxlength="100" required />

        <label for="numPag">Número de páginas</label>
        <input type="number" id="numPag" name="fnumPag" min="1" required />

        <label for="reu">Precio (€)</label>
        <input type="number" id="reu" name="freu" min="0" step="0.01" required />

        <input type="submit" value="Guardar libro" />
    </form>
</body>
</html>
